cost_weight:
  cte_cost_weight: 3500
  epsi_cost_weight: 2200

  # cost += v_start_weight * (v[t] - v_target[t])^2  (v: 예측 속도, v_target: MPC 목표 속도)
  v_start_weight: 20

  delta_cost_weight: 800

  # cost += delta_start_cost_weight * (delta[0] - 직전 조향 명령)^2
  # 첫 조향이 직전 명령과 이어지게 해서 고속 직선 조향 부호 플리핑을 줄인다.
  delta_start_cost_weight: 30000
  # 조향 비용 배율(delta_start/delta/delta_change 에 곱함). Lf 4.0 과 한 쌍:
  # Lf 가 커지면 같은 회전에 필요한 조향이 커지므로 조향 항을 줄여 공격성을 맞춘다.
  steer_scale: 0.40

  # 오차가 나도 속도를 임의로 깎지 않고 ref_v 를 유지
  v_target_cost_weight: 300
  delta_change_cost_weight: 350000

  # 속도 명령 변화 완화
  v_target_change_cost_weight: 100

# ==============================================================================
# 제어 속도 상한 (Control Speed Limits)
# - 도심/고주로 최고속도, 규정 초과 방지 하드리미터(control_arbiter)
# - 미션 구간별 상한(constraint_to_speed_cap 연동), 특수 기동(회피/카메라 킥) 상한
# ==============================================================================
speed_limit:
  # 1. 권역별 최고속도 상한 (m/s)
  urban_max_mps: 16.0 # 도심 (57.6 km/h, 규정 60 km/h 이하)
  highway_max_mps: 25.0 # 고주로 (90 km/h)

  # 2. 규정 초과 방지 하드리미터 (control_arbiter 전용)
  hard_limit_enabled: true
  hard_limit_mps: 16.2 # 58.3 km/h 를 넘으면 즉시 제동
  hard_limit_brake: 0.25 # 제동 세기 (0~1)
  hard_limit_release_mps: 0.4 # 해제 마진 (15.8 m/s 아래로 내려오면 해제)

  # 3. 특수 기동 속도 상한
  # 회피가 걸리면 이 값이 상한이 되고, obstacle_avoidance_node 가 경로의 s_clear 로 매 주기 이 아래로 낮춘다.
  avoidance_mps: 12.0
  camera_kick_mps: 7.5 # 카메라/라이다 인지 사전 감속 킥 속도 (동적 구간 M3, 음영구간에서만)

  # 4. 미션 구간별 속도 상한 (constraint_to_speed_cap 연동). 여기만 바꾸면 missions.yaml 수정 없이 반영된다.
  # M6/M7 고주로는 한 구간에 직선·곡선이 섞여 있어 mission_speed.state_3/state_4 를 쓴다.
  sections:
    M1: 12.0 # 신호등 1
    M2: 12.0 # 정적 장애물
    M3: 12.0 # 동적 장애물
    M4: 12.0 # 신호등 4 + 다섯번째 신호등 (정지선 두 개)
    M5: 16.0 # 회전교차로 접근
    M7B: 16.0 # 터널 접근 (고주로에서 한 단계 거쳐 감속)
    M8: 11.0 # 터널/음영구간 (랜덤 장애물 + GPS 데드리코닝)

# ==============================================================================
# 도심 (M1~M5, M8) 제어 파라미터. 실제 속도에 따라 저속(코너) 세트와 고속(직선) 세트를
# delta_cost_start_mps ~ delta_cost_full_mps 사이에서 섞는다. 고주로와 회피 경로에는 쓰지 않는다.
# ==============================================================================
urban_control:
  curvature_lateral_accel_limit_mps2: 7.0 # 일반 코너 횡가속 한계 (급커브는 곡률 기준 감속 유지)
  curvature_rate_limit_up_mps2: 6.5 # 코너 탈출 시 곡률 속도 제한 회복
  cte_cost_start_weight: 5000.0 # 저속(코너) 세트 횡오차 가중치
  cte_cost_urban_weight: 750.0 # 고속(직선) 세트 횡오차 가중치
  epsi_cost_weight: 80000.0 # 헤딩 감쇠: 직선·코너 탈출 0.5 Hz 위빙과 저속 조향 떨림 억제
  delta_cost_start_weight: 2500.0 # 저속 미세 조향 억제
  delta_cost_high_speed_weight: 60000.0 # 고속 조향 억제
  delta_cost_start_mps: 8.5 # 이 속도까지 저속(코너) 세트
  delta_cost_full_mps: 11.5 # 이 속도부터 고속(직선) 세트 (42 km/h 순항이 고속 세트에 들도록)
  delta_change_cost_start_weight: 350000.0 # 코너 턴인/역조향 응답
  delta_change_cost_urban_weight: 1000000.0 # 고속 조향 슬루 억제
  preview_distance_m: 45.0 # 커브 감속 preview 거리 (m)
  max_speed_mps: 16.0 # 도심 최고속도 상한 (m/s)

# M2 정적 장애물 회피 경로를 추종하는 동안에만 쓴다. 회피 S-curve 에 대한 횡오차 응답만 빠르게 한다.
avoidance_control:
  cte_cost_weight: 4000.0
  epsi_cost_weight: 4000.0
  delta_cost_weight: 12000.0
  delta_change_cost_weight: 350000.0
  # 회피 경로용 곡률 속도 상한 (경로 생성기 spatial_max_lat_accel 3.0 과 맞춤). 다른 구간은 curvature_speed 값을 쓴다.
  lateral_accel_limit_mps2: 3.0
  curvature_min_speed_mps: 3.0 # 급한 회피 곡선에서 전역 최저속도(4.5)로 횡가속 한계를 넘지 않도록
  # 위 프로파일을 쓰는 구간 (회피 경로 속도명령이 살아 있을 때만)
  sections: [M2, M8]

# ==============================================================================
# 고주로 (M6, M7 speed_limit_exempt, 최고 25 m/s) 제어 파라미터. 차선변경 후 헤딩 진동이 없도록 맞춤.
# 고속에서는 작은 조향에도 헤딩이 크게 반응해서 게인을 낮추고 감쇠를 키운 쪽으로 잡았다.
# ==============================================================================
highway_control:
  cte_cost_weight: 1000.0 # 고속 횡방향 과민 반응 완화
  epsi_cost_weight: 10500.0 # 헤딩 감쇠
  delta_cost_weight: 52000.0 # 고속 조향각 억제
  delta_change_cost_weight: 750000.0 # 고속 조향 변화율 억제
  preview_distance_m: 45.0 # 고속 제동거리용 preview (m)
  max_speed_mps: 25.0 # 고주로 최고속도 상한 (m/s)

# 미사용(레거시). mpc.cpp 는 urban_control/highway_control 만 읽으므로 여기 값을 바꿔도 반영되지 않는다.
speed_scheduled_cost:
  enabled: true
  delta_cost_start_mps: 7.0
  delta_cost_full_mps: 15.0
  delta_cost_start_weight: 1200.0
  delta_cost_high_speed_weight: 38000.0
  cte_cost_start_weight: 6000.0
  cte_cost_urban_weight: 1500.0
  epsi_cost_start_weight: 2400.0
  epsi_cost_urban_weight: 2400.0
  delta_change_cost_start_weight: 350000.0
  delta_change_cost_urban_weight: 650000.0

k_v: 0.4
N: 30 # horizon 30*0.05 = 1.50 s (45 는 IPOPT 가 10 Hz 아래로 느려진다)
dt: 0.05
ref_v: 15.0 # 기본 순항 목표속도 (m/s). 실제 상한은 speed_limit / mission_speed 가 정한다
speed:
  upperBound: 40.0 # 솔버 변수 절대 상한 (주행 상한은 speed_limit 이 동적으로 클램핑)
  lowerBound: 0.0
steer:
  upperBound: 0.6981
  lowerBound: -0.6981
  # MORAI 조향 부호 반대
  command_sign: -1.0
  # 조향 슬루레이트 (1.8 rad/s = 103 deg/s)
  command_rate_limit_radps: 1.8

  # 최종 /ctrl_cmd.steering 출력 LPF
  output_lpf_enabled: true
  output_lpf_alpha: 0.65
  output_lpf_alpha_high_speed: 0.72 # 고속 조향 출력 고주파 진동 흡수

  # 고정 τ 조향 지연보상(민성 MPC 방식): 지난 조향 명령을 이 시간만큼 적분한 미래 자세에서 MPC 를 시작한다.
  # 0 이면 꺼짐. delay_comp 가 켜져 있으면 쓰지 않는다.
  actuator_delay_s: 0.0
  # 이력 적분에 쓸 Lf. 0 이하면 아래 Lf 사용.
  delay_model_lf: 0.0

# MPC 모델 Lf. 축거(3.0 m)가 아니라 MORAI 조향->요 응답의 실효값(실측 4.02~4.04). cost_weight/steer_scale 과 한 쌍.
Lf: 4.0

# MORAI CtrlCmd longitudinal control.  Mode 1 directly controls pedals using
# /Competition_topic speed feedback; accel and brake are clamped to 0~1.
longitudinal:
  command_type: 1
  throttle_kp: 0.22
  throttle_ki: 0.02
  # 목표 1 m/s 안에서만 적분(램프 중 와인드업 없음). 목표보다 0.1 m/s 넘게 빠르면 양(+)의 적분을 지워 과속을 막는다.
  throttle_integral_limit: 6.0
  throttle_integral_band_mps: 1.0
  # 가속 페달 상한 (페달 0.6 = 1.3~1.5 m/s^2, 1.0 = 3.3~4.9 m/s^2)
  throttle_accel_limit: 1.0
  # M6/M7(고주로) 구간 전용 가속 페달 상한
  throttle_accel_limit_exempt: 1.0
  # 평소 감속 브레이크 상한 (급제동 시 피칭 억제). 비상/킥 제동은 kick_brake_limit 를 쓴다.
  throttle_brake_limit: 0.50
  # static_speed_scale(카메라/라이다 감속 킥) 때만 쓰는 브레이크 세기
  kick_brake_limit: 1.0
  # 브레이크 초당 최대 증가량. 실제 위험 정지는 obstacle_stop_node 가 /ctrl_cmd 를 직접 덮어써서 이 경로를 거치지 않는다.
  brake_rate_limit_per_sec: 2.0
  # 페달 데드밴드: 목표속도 근처에서는 가속/제동 모두 0(타행)
  throttle_pedal_deadband: 0.04
  # 목표속도 램프 피드포워드. 페달 = gain * (목표속도 상승 기울기) / accel_per_pedal (가속 ~= 3.5 * 페달).
  # 올라갈 때만 쓰고 목표가 일정하면 0. 끄려면 throttle_ff:=0
  throttle_ff_gain: 1.0
  throttle_ff_accel_per_pedal_mps2: 3.5
  throttle_ff_tau_s: 0.3
  throttle_ff_min_accel_mps2: 0.6   # 정속 중 목표 잡음은 버리고 램프만 쓴다
  throttle_ff_taper_mps: 1.0        # 목표와 오차가 이보다 작으면 비례 감소 -> 램프 끝에서 목표를 넘지 않게
  throttle_ff_steer_zero_rad: 0.20  # |조향| 이 이 값 이상이면 FF 0 (급커브 출구에서 바깥으로 밀리는 것 방지)
  # 규정 3-2(속도 예외 구간 밖 60 km/h 초과 15 s) 보호. 예외 구간 판정은 MPC determineIsHighway.
  # speed_limit/hard_limit_* 는 control_arbiter 전용이라 대회 launch 에서는 이것이 실제 보호다.
  legal_guard:
    enabled: true
    cut_mps: 16.2        # 58.3 km/h 넘으면 가속 페달 0
    brake_at_mps: 16.4   # 59.0 km/h 넘으면 brake
    brake: 0.3

# /local_path 가 끝점 근처에서 너무 짧아지면 3차 polyfit 에 필요한 점이 부족해 MPC 가 죽을 수 있다.
# 이때는 solve 를 건너뛰고 stop command 를 낸다.
path_end_stop:
  enabled: true
  min_polyfit_points: 4
  # 경로 끝 접근 감속 시작 거리. M2 임베디드 경로(38~39 m)에서 장애물 없이 감속에 묶이지 않도록 30 m.
  approach_trigger_m: 30.0

# waypoint_system CSV 4번째 컬럼 mission_state 기반 속도 계획 (m/s).
# state 목표속도를 먼저 적용하고, curvature_speed 가 필요하면 한 번 더 낮춘다.
mission_speed:
  enabled: true
  # state 변경으로 목표속도가 바뀔 때 가감속 슬루 제한 (m/s^2)
  rate_limit_up_mps2: 3.0
  rate_limit_down_mps2: 3.0
  # 0.csv 도심 기본 순항속도
  default_mps: 16.0
  # CSV 4번째 컬럼 state 별 제한속도
  state_0_mps: 16.0
  state_1_mps: 16.0
  state_2_mps: 16.0
  state_3_mps: 35.0 # 고주로 직선 상한
  # 고주로 곡선 구간(3.csv idx 3000~5599, 2.csv idx 3000~4179)
  state_4_mps: 20.0 # 고주로 곡선 상한
  state_5_mps: 16.0
  state_6_mps: 16.0
  state_7_mps: 16.0
  state_8_mps: 16.0
  state_9_mps: 16.0
  state_10_mps: 16.0
  state_11_mps: 16.0
  state_12_mps: 16.0

# 곡률 기반 속도 제한. MPC 추종은 /local_path 를 쓰고, 속도 제한은 경로 곡률을 누적거리 기준으로 preview 한다.
# 커브에서는 Solve 1회 동안 ref_v/speed.upperBound 를 낮춘다.
curvature_speed:
  enabled: true
  # splined.csv rk 의 재보간 스파이크를 피해 MPC 자체 polyfit 곡률을 쓴다
  use_waypoint_rk: false
  fallback_to_polyfit: true # rk 가 없거나 너무 작으면 polyfit 곡률 사용
  lateral_accel_limit_mps2: 2.2 # 코너 진입 목표속도용 횡가속 한계 (약 0.22 g)
  min_speed_mps: 4.5 # 급커브 최소 속도 하한
  max_speed_mps: 0.0 # 0 이면 ref_v/speed.upperBound 중 작은 값
  preview_distance_m: 28.0 # 기본값 (주행 중에는 urban_control/highway_control 값으로 구간별 전환)
  min_lookahead_m: 0.5 # 바로 앞 피팅 노이즈 무시
  deadband_inv_m: 0.035 # R < 28 m 급커브 감속
  sample_count: 40
  percentile: 0.80 # 1.0 이면 max, 0.80 이면 상위 80% 곡률
  rate_limit_up_mps2: 4.0 # 커브 탈출 후 재가속
  rate_limit_down_mps2: 4.5 # 커브 진입 전 감속

# 지연보상 v2. PC 에 따라 바뀌는 지연은 매 주기 실측하고, 차량 고유 지연만 고정값으로 둔다.
#   상태 지연  d_state = state_k * T + state_c_s + odom_age   (T = MORAI 센서(/imu) 주기)
#   계산 지연  MPC 계산 시간 실측(EMA)
#   조향 지연  tau_act = actuation_base_s + actuation_frame_k * T
# 켜면 steer/actuator_delay_s(고정 τ) 대신 이것을 쓴다. MORAI 가 14 Hz 아래로 떨어지면 측위 한계로 유지되지 않는다.
delay_comp:
  enabled: true            # 끄려면 delay_comp:=false
  state_k: 1.0
  state_c_s: -0.004         # state_input/source 와 한 쌍 (ekf: -0.004, odom: 0.010)
  state_max_s: 0.12
  actuation_base_s: 0.06
  actuation_frame_k: 0.5
  model_lf: 4.0            # 사전값 (MORAI 실측 실효 Lf)
  lf_online: true          # 곡선에서 실효 Lf 를 실시간 측정해 사전값을 대체
  fallback_period_s: 0.020 # /imu 가 끊기면 50 Hz 로 가정
  compute_max_s: 0.10

# MPC 상태 입력. ekf = /ekf_pose_with_covariance + /ekf_twist_with_covariance 를 바로 받는다(stamp 가 EKF 계산 시각).
# odom = ekf_odom_output 가 다시 내는 /odom (재발행 대기 8~18 ms 가 stamp 에 안 잡힌다). 다른 노드는 /odom 을 쓴다.
state_input:
  source: ekf

# MPC 입력 위치 필터. GPS(NMEA)가 0.15~0.19 m 계단으로 와서 생기는 EKF 위치·헤딩 떨림을 직선에서만 거른다.
# 차속·요레이트로 적분하고 EKF 쪽으로 1 s 에 걸쳐 맞추며, EKF 와는 최대 4 cm / 0.3 deg 까지만 다르게 본다.
# 커브·출발·GPS 음영/복귀·정지/후진 중에는 EKF 그대로. 나머지 값은 코드 기본값(mpc_path_tracking.h).
state_filter:
  enabled: true
