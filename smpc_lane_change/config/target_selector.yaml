waypoint_directory: ''
target_source: 'tracked_objects' # tracked_objects/lidar or object_topic/morai
tracked_objects_topic: '/tracked_objects'
object_topic: '/Object_topic'
odom_topic: '/odom'
state_topic: '/gps_state'
lane_half_width: 1.75 #2.2
max_front_range: 120.0
max_rear_range: 120.0
min_tracked_hits: 2
tracked_dynamic_only: false # false keeps stopped vehicles/static obstacles available for ACC safety
# A partly occluded vehicle can expose less than 1 m of its true length.  The
# tracker confidence below removes pole/wall noise before it reaches SMPC.
min_object_length_m: 0.7
max_object_length_m: 15.0
min_object_width_m: 0.4
max_object_width_m: 3.5
# 낙하물·저상 장애물은 20cm 를 넘지 않는 경우가 많다. 이 하한이 형상 단계에서
# 먼저 자르면 뒤의 신뢰도 판단이 아예 실행되지 않으므로, 노면 잔차 방어는
# tracked_unknown_obstacle_min_confidence(장애물성)에 맡기고 여기는 풀어둔다.
min_object_height_m: 0.10
max_object_height_m: 4.5
tracked_vehicle_filter_enabled: true
tracked_vehicle_min_confidence: 0.5 #0.6
# is_vehicle now has enter/exit hysteresis in lidar_ttc_tracker. Trust that
# latched state even while sparse long-range scans temporarily lower its score.
trust_tracker_vehicle_hysteresis: true
# 0.42~0.60: no multi-vehicle prediction, but retain it as a conservative
# current/target-lane obstacle.  <0.42: reject geometry that looks structural.
# 이 문턱은 차량성이 아니라 장애물성(obstacle_confidence)에 걸린다 - 낮은
# 장애물은 '차 모양이 아닌' 것이지 '없는' 것이 아니다.
tracked_unknown_obstacle_min_confidence: 0.35 #0.42
# A new long-range target-lane object may not yet have enough visible chord to
# become a confirmed vehicle. Feed only persistent, elevated, lane-centered
# candidates to SMPC risk; representative ACC roles keep their existing path.
provisional_far_vehicle_enabled: true
provisional_far_vehicle_min_range_m: 25.0
provisional_far_vehicle_min_hits: 3
provisional_far_vehicle_min_obstacle_confidence: 0.55
provisional_far_vehicle_max_target_abs_d_m: 1.6
align_tracked_yaw_with_velocity: true
min_yaw_align_speed_mps: 1.0
bbox_overlap_margin_m: 0.2
# VLP-16 can split one car into overlapping front/side clusters. Keep the
# stronger established track before selecting target_front/rear/nearby roles.
tracked_fragment_dedup_enabled: true
tracked_fragment_overlap_margin_m: 0.25

# Representative current_front/target_front/target_rear should be vehicles
# established near that lane center.  Boundary-touching adjacent-lane vehicles
# remain in nearby_vehicles for SMPC trajectory-risk evaluation, but they should
# not be promoted to ACC front leads.
representative_lane_center_filter_enabled: true
# 1.1 -> 1.6 (2026-09-15). 고주로 앞차 인식률을 올린다.
#   실측(09-15 12:44 백, 고주로 273~315s, 전방 0~60m 트랙 396개)
#   필터 단계별 탈락:
#     길이<0.7        55 (14%)   <- 0.5m 정사각 파편. 풀면 오탐이 ACC 를 건다
#     폭  <0.4         2 ( 1%)
#     confidence 미달   0 ( 0%)   <- 이미 전부 통과. 여기 완화는 무효
#     횡오프셋>1.1    295 (74%)   <- 유일하게 의미 있는 손잡이
#     통과            44 (11%)
#   그 295개의 |횡오프셋| 분포:
#     1.10~1.75  21 ( 5%)  내 차로 - 회복 대상
#     1.75~2.50 122 (31%)  차로 경계
#     2.50~      209 (53%)  옆 차로 - 잡으면 ACC 가 옆차를 따라간다
# 차로 반폭(lane_half_width 1.75)보다 작게 둬서 옆 차로는 계속 배제한다.
# 기대 효과는 전방 트랙 기준 11% -> 16% 로 제한적이다 - 같은 백에서 내 차로
# 전방에 차가 실제로 있던 프레임 자체가 341 중 56(16%)뿐이었고, 진짜 병목은
# 25m 밖 OBB 붕괴(vehicle_score 강제 0)라 파라미터로는 넘을 수 없다.
# 1.6 -> 1.7 (2026-09-17). 아래 release 문턱과 함께 쓴다.
#   실측(12:17 백, 고주로 t=175.6~176.4): 앞차 id76 이 11 m -> 3 m 로
#   접근하는 동안 |d| 가 1.47~1.65 로 진동해 문턱(1.6)을 넘나들었고,
#   그때마다 current_front 가 무효가 됐다. 크기/신뢰도 필터는 전부 통과한
#   실제 차량이었는데 ACC 가 추종하지 못했다.
#   같은 구간 전방 트랙 273개의 |횡오프셋| 분포:
#     0.0~0.8  24% / 0.8~1.2  6% / 1.2~1.6  8%
#     1.6~2.0  15%  <- 차로 반폭(1.75) 안쪽이라 대부분 내 차로 차량
#     2.0~3.0  47%  <- 옆 차로. 계속 배제해야 한다
representative_lane_center_max_abs_d_m: 1.7 #1.6 #1.1 #1.35
# 한 번 대표(current_front/target_front/rear)로 채택된 트랙의 이탈 문턱.
# enter(1.7)보다 크게 둬서 경계에서 깜빡이지 않게 한다. 옆 차로 중심은
# 3.5 m 떨어져 있으므로 2.0 에서도 오귀속되지 않는다.
representative_lane_center_release_abs_d_m: 2.0
target_lane_offset: 1
# 1/2/3.csv의 index 0 이전도 같은 접선으로 가상 연장한다. CSV 파일과
# index는 바꾸지 않으며, 시작점 전의 옆 차량을 목표 차로에 귀속시키는 용도다.
lane_start_extension_m: 80.0
lane_start_extension_spacing_m: 0.1
# 위 연장과 별개인 근접 충돌 이중 안전장치. 확정 차량이 어느 CSV에도
# 귀속되지 않더라도 차선변경 방향 바로 옆이면 목표 앞/뒤 차량으로 보수 처리한다.
unassigned_side_vehicle_guard_enabled: true
unassigned_side_vehicle_front_m: 10.0
unassigned_side_vehicle_rear_m: 18.0
unassigned_side_vehicle_lateral_min_m: 1.0
unassigned_side_vehicle_lateral_max_m: 5.5
yaw_rate_alpha: 0.15
max_abs_yaw_rate: 0.6

# Stabilize LiDAR PCA OBB yaw before publishing /smpc/targets and RViz vehicle markers.
# Raw PCA yaw is noisy/180-deg ambiguous, especially under partial occlusion.  Fuse it
# with velocity heading and nearby lane yaw, then apply an angular EMA.
stabilize_tracked_yaw: true
tracked_yaw_filter_alpha: 0.18
tracked_yaw_history_timeout_sec: 1.0
tracked_yaw_max_step_rad: 0.07
tracked_yaw_velocity_blend_weight: 0.25
tracked_yaw_lane_blend_weight: 0.90
tracked_yaw_lane_max_error_rad: 1.57
tracked_yaw_lateral_reduction_gain: 0.0
tracked_yaw_lateral_speed_reduce_mps: 0.8
# At 8 Hz, retain the directed CSV lane-heading prior for 12 hits (about
# 1.5 s), preventing raw PCA yaw from taking over immediately.  Lane-change
# evidence is ignored until the 12-hit initial yaw-prior window has completed,
# then must persist for three frames;
# it must then be absent for five frames before normal lane-yaw stabilization
# resumes. This keeps initial Kalman lateral-velocity noise from bypassing the
# directed lane-yaw prior.
tracked_yaw_lane_prior_hits: 12
tracked_yaw_lane_change_boundary_abs_d_m: 1.0
tracked_yaw_lane_change_lateral_speed_mps: 0.35
tracked_yaw_lane_change_weight_scale: 0.15
tracked_yaw_lane_change_confirm_hits: 3
tracked_yaw_lane_change_release_hits: 5
tracked_yaw_lane_change_min_track_hits: 12

# Low-confidence PCA yaw is common with sparse/partially occluded VLP16 clusters.
# Preserve the existing high-confidence behavior; below this band use velocity
# while moving and the directed lane tangent while slow/stopped.
tracked_yaw_confidence_enabled: true
tracked_yaw_confidence_low: 0.35
tracked_yaw_confidence_high: 0.70
tracked_yaw_low_confidence_velocity_blend_weight: 0.70
# A moving q<=low target starts from velocity heading; retain this limited lane
# pull (rather than snapping it all the way back to the lane tangent).
tracked_yaw_low_confidence_lane_blend_weight: 0.40
tracked_yaw_velocity_min_hits: 3

# Lanes 0,1,2 prepare for their mandatory left change immediately while the
# highway section is active; lane 3 is terminal. These remaining-distance/time
# thresholds only raise the state to urgent or emergency.
final_lane_id: 3
lane_end_urgent_time_sec: 5.0
lane_end_emergency_time_sec: 1.0
lane_end_urgent_distance_m: 120.0
lane_end_emergency_distance_m: 15.0

# Vehicle candidates beyond the representative current/target gap vehicles.
nearby_front_range: 150.0
nearby_rear_range: 120.0
# 차로 귀속 판정 여유. 판정식은
#   |d| - half_d <= lane_half_width(1.75) + bbox_overlap_margin(0.2) + 이 값
# 이다. 0.7 이면 문턱이 2.65 m 인데 차로 간격은 3.5 m 뿐이다. 옆옆 차로에
# 있는 차는 옆 차로 중심선 기준 2.55 m(폭 1.9 기준) 라 이 문턱 안에 들어와
# '옆 차로 차량'으로 등록됐다 - 지나가기만 하는 차가 차선변경 안전영역을
# 계속 막았다(smpc_decision_node 는 v.lane_id == target_lane_id 로 위험을
# 따지므로, 귀속이 틀리면 그대로 차선변경 불허가 된다).
#   문턱 조건: 자기 차로 가장자리 차(0.80 m, 대형차 0.50 m)는 살리고,
#   옆옆 차로 차(승용 2.55 m / 대형 2.25 m)는 빼야 하므로
#   0.80 < 문턱 < 2.25.
# 0.7 -> 0.0 으로 문턱을 1.95 m 로 내린다. 자기 차로를 벗어나 걸친 차는
# half_d 와 bbox_overlap_margin 이 이미 흡수한다(경계 걸침 1.65 m 통과).
# 차는 차로마다 따로 투영되고 가장 가까운 차로가 채택되므로(makeNearbyVehicle
# 의 score), 옆 차로 프레임에서 빠져도 안 보이게 되는 게 아니라 자기 차로로
# 제대로 귀속될 뿐이다.
nearby_lane_margin_m: 0.0 #0.7 #1.0
max_nearby_vehicles: 40

# PCA OBB yaw is 180 deg ambiguous and noisy for slow/stopped traffic.
lane_yaw_align_when_slow: true
lane_yaw_align_max_speed_mps: 1.5
lane_yaw_align_weight: 0.85

# RViz debug visualization.
debug_publish_csv_paths: true
debug_show_csv_file_path: true
debug_show_ego_vehicle: true
debug_show_nearby_vehicles: true
debug_show_nearby_labels: false
debug_use_vehicle_mesh: true
debug_vehicle_mesh_resource: 'package://smpc_lane_change/meshes/debug_vehicle.stl'
debug_marker_lifetime_sec: 0.5
debug_vehicle_height_m: 1.5
debug_label_height_m: 2.5
debug_csv_path_z_m: 0.05
debug_max_csv_points_per_lane: 2500

# 미확정 소형 물체는 실제 자차 진행 폭에 겹칠 때만 current_front로 사용.
unknown_current_corridor_half_width_m: 1.10 # 차량 반폭 0.95m + 여유 0.15m
